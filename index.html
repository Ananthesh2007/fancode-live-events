<!DOCTYPE html>
<html>
<head>
<title>FanCode Live Player</title>
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body {
    background:#111;
    color:white;
    margin:0;
    font-family:Arial;
}
#grid {
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
    gap:10px;
    padding:10px;
}
video {
    width:100%;
    background:black;
}
</style>
</head>

<body>

<h2 style="padding:10px">FanCode Live Streams</h2>
<div id="grid"></div>

<script>
const M3U_URL = "https://raw.githubusercontent.com/drmlive/fancode-live-events/main/fancode.m3u";

let currentLinks = [];

async function loadM3U() {
    const response = await fetch(M3U_URL + "?t=" + Date.now());
    const text = await response.text();

    const lines = text.split("\n");
    const links = lines.filter(l => l.startsWith("http"));

    if (JSON.stringify(links) !== JSON.stringify(currentLinks)) {
        currentLinks = links;
        buildPlayers(links);
    }
}

function buildPlayers(links) {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    links.forEach(url => {
        const video = document.createElement("video");
        video.controls = true;
        video.autoplay = true;
        video.muted = true;

        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
        } else {
            video.src = url;
        }

        grid.appendChild(video);
    });
}

loadM3U();
setInterval(loadM3U, 60000);
</script>

</body>
</html>
